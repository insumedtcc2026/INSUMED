<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0042EC" />

    <!-- Fontes da documentação: Inter (títulos/textos), Poppins (textos), Montserrat (menus e botões) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@500;600;700;800&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>INSUMED</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- VLibras: tradução do conteúdo para Libras (widget oficial do Governo Federal) -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js" defer></script>
    <script>
      window.addEventListener('load', function () {
        if (window.VLibras) new window.VLibras.Widget('https://vlibras.gov.br/app');
      });
    </script>
  </body>
</html>
